name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check repository text and local links
        run: python3 scripts/check.py
      - name: Test the Docker lifecycle with synthetic data
        run: python3 -m unittest discover -s tests -v
